<!DOCTYPE html>
<html>
<head>
    <title>Super Metroid Native</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        EJS_player = '#game';
        EJS_core = 'snes'; // Tells EmulatorJS to use SNES core
        EJS_gameUrl = 'sfc/dread.sfc'; // Path to your ROM
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Using CDN for simplicity
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
