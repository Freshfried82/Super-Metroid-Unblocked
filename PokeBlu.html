<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pokémon Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100%;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }
        #topbar {
            padding: 10px;
            background: #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #game {
            width: 100vw;
            height: calc(100vh - 50px);
        }
    </style>
</head>
<body>

<div id="topbar">
    <label for="romInput">Load Pokémon ROM:</label>
    <input type="file" id="romInput" accept=".gba,.gbc,.gb">
</div>

<div id="game"></div>

<script>
    const romInput = document.getElementById("romInput");

    romInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);

        // EmulatorJS config updated for Pokémon
        window.EJS_player = "#game";
        
        // Changing 'snes' to 'gba' allows playing most Pokémon titles
        window.EJS_core = "gba"; 
        window.EJS_gameUrl = url;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;

        // Reset the container
        document.getElementById("game").innerHTML = "";

        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
    });
</script>

</body>
</html>
